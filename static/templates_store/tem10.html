<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Curtain Slideshow</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #111;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial;
}
.slide {
    width: 350px;
    height: 620px;
    position: relative;
    overflow: hidden;
    border: 3px solid #fff;
    border-radius: 12px;
    background: #000;
    box-shadow: 0 0 40px rgba(255,255,255,0.08);
}
.slide img {
    width: 100%; height: 100%;
    object-fit: cover;
    position: absolute;
    top: 0; left: 0;
}
.curtain-h { animation: curtainH 1s forwards; }
@keyframes curtainH {
    from { clip-path: inset(0 50% 0 50%); }
    to   { clip-path: inset(0 0 0 0); }
}
.curtain-v { animation: curtainV 1s forwards; }
@keyframes curtainV {
    from { clip-path: inset(50% 0 50% 0); }
    to   { clip-path: inset(0 0 0 0); }
}
.curtain-zoom { animation: curtainZoom 1s forwards; }
@keyframes curtainZoom {
    from { transform: scale(0.4); opacity: 0; clip-path: inset(20% 20% 20% 20%); }
    to   { transform: scale(1);   opacity: 1; clip-path: inset(0 0 0 0); }
}
.exit { animation: fadeOut 0.4s forwards; }
@keyframes fadeOut { to { opacity: 0; } }
.controls { display: none !important; }
</style>
</head>
<body>
<div class="slide">
    <img id="img" src="">
</div>
<script>
let images = [
    "https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=1000",
    "https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?w=1000",
    "https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=1000",
    "https://images.unsplash.com/photo-1519681393784-d120267933ba?w=1000",
    "https://images.unsplash.com/photo-1472214103451-9374bd1c798e?w=1000",
    "https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=1000"
];
const curtains = ["curtain-h","curtain-v","curtain-zoom","curtain-h","curtain-v","curtain-zoom"];
const img = document.getElementById("img");
let idx = 0;

function showSlide() {
    const effect = curtains[idx % curtains.length];
    img.className = "";
    img.src = images[idx % images.length];
    img.classList.add(effect);
    setTimeout(() => {
        img.classList.remove(effect);
        img.classList.add("exit");
    }, 3000);
    idx++;
    setTimeout(showSlide, 4000);
}
window.onload = showSlide;

window.addEventListener('message', function(e) {
    if (!e.data || e.data.type !== 'REELFORGE_IMAGES') return;
    if (!e.data.images || !e.data.images.length) return;
    images = e.data.images;
    idx = 0;
});
</script>
</body>
</html>
