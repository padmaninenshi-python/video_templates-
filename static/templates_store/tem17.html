<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>5 Image Dynamic</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#111;display:flex;justify-content:center;align-items:center}
.slide{width:100%;height:100%;position:relative;overflow:hidden;background:#000;perspective:1200px}
.slide img{width:100%;height:100%;object-fit:cover;position:absolute}
.boxIn{animation:boxIn 1s forwards}
@keyframes boxIn{0%{transform:scale(0.1);opacity:0}100%{transform:scale(1);opacity:1}}
.boxOut{animation:boxOut 1s forwards}
@keyframes boxOut{0%{transform:scale(2);opacity:0}100%{transform:scale(1);opacity:1}}
.rotateCW{animation:rotateCW 1s forwards}
@keyframes rotateCW{0%{transform:rotate(-180deg) scale(0);opacity:0}100%{transform:rotate(0) scale(1);opacity:1}}
.rotateCCW{animation:rotateCCW 1s forwards}
@keyframes rotateCCW{0%{transform:rotate(180deg) scale(0);opacity:0}100%{transform:rotate(0) scale(1);opacity:1}}
.flipH{animation:flipH 1s forwards}
@keyframes flipH{0%{transform:rotateY(90deg);opacity:0}100%{transform:rotateY(0);opacity:1}}
.exit{animation:fadeOut 0.5s forwards}
@keyframes fadeOut{to{opacity:0}}
</style>
</head>
<body>
<div class="slide"><img id="img"></div>
<script>
let images=["https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?w=1000","https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=1000","https://images.unsplash.com/photo-1519681393784-d120267933ba?w=1000","https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=1000","https://images.unsplash.com/photo-1472214103451-9374bd1c798e?w=1000"];
const effects=["boxIn","boxOut","rotateCW","rotateCCW","flipH"];
const img=document.getElementById("img");
let idx=0;
function show(){
  const eff=effects[idx%effects.length];
  img.className="";img.src=images[idx%images.length];
  img.classList.add(eff);
  setTimeout(()=>{img.classList.remove(eff);img.classList.add("exit");},2800);
  idx++;setTimeout(show,3500);
}
window.onload=show;
window.addEventListener('message',function(e){
  if(!e.data||e.data.type!=='REELFORGE_IMAGES')return;
  if(!e.data.images||!e.data.images.length)return;
  images=e.data.images;idx=0;
});
</script>
</body>
</html>
