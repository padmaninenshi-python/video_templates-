<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dynamic Motion Path Slideshow</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #111;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial;
}
.slide {
    width: 350px;
    height: 620px;
    position: relative;
    overflow: hidden;
    border: 3px solid #fff;
    border-radius: 12px;
    box-shadow: 0 0 40px rgba(255,255,255,0.08);
}
.slide img {
    position: absolute;
    width: 100%; height: 100%;
    object-fit: cover;
}
.line { animation: lineMove 1.4s ease-out forwards; }
@keyframes lineMove {
    from { transform: translateX(-500px); opacity:0; }
    to   { transform: translateX(0); opacity:1; }
}
.arc { animation: arcMove 1.4s ease-out forwards; }
@keyframes arcMove {
    0%   { transform: translate(-300px,250px) rotate(-30deg); opacity:0; }
    100% { transform: translate(0,0) rotate(0deg); opacity:1; }
}
.turn { animation: turnMove 1.4s ease-out forwards; }
@keyframes turnMove {
    0%   { transform: rotate(-90deg) translateX(-400px); opacity:0; }
    100% { transform: rotate(0) translateX(0); opacity:1; }
}
.shape { animation: shapeMove 1.4s ease-out forwards; }
@keyframes shapeMove {
    0%   { transform: scale(0.3) rotate(180deg); opacity:0; }
    100% { transform: scale(1) rotate(0); opacity:1; }
}
.custom { animation: customMove 1.4s ease-out forwards; }
@keyframes customMove {
    0%   { transform: translate(-300px,-250px); opacity:0; }
    50%  { transform: translate(80px,80px); }
    100% { transform: translate(0,0); opacity:1; }
}
.exit { animation: fadeOut 0.9s forwards; }
@keyframes fadeOut { to { opacity:0; } }
.controls { display: none !important; }
</style>
</head>
<body>
<div class="slide">
    <img id="img" src="">
</div>
<script>
let images = [
    "https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?w=1000",
    "https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=1000",
    "https://images.unsplash.com/photo-1519681393784-d120267933ba?w=1000",
    "https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=1000",
    "https://images.unsplash.com/photo-1492724441997-5dc865305da7?w=1000"
];
const paths = ["line","arc","turn","shape","custom","line","arc","shape"];
const img = document.getElementById("img");
let idx = 0;

function showSlide() {
    img.className = "";
    img.src = images[idx % images.length];
    img.classList.add(paths[idx % paths.length]);
    setTimeout(() => {
        img.classList.remove(paths[idx % paths.length]);
        img.classList.add("exit");
    }, 2500);
    idx++;
    setTimeout(showSlide, 4000);
}
window.onload = showSlide;

window.addEventListener('message', function(e) {
    if (!e.data || e.data.type !== 'REELFORGE_IMAGES') return;
    if (!e.data.images || !e.data.images.length) return;
    images = e.data.images;
    idx = 0;
});
</script>
</body>
</html>
