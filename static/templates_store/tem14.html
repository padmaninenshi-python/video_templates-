<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Advanced PPT</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#111;display:flex;justify-content:center;align-items:center}
.slide{width:100%;height:100%;position:relative;overflow:hidden;background:#000;perspective:1200px}
.slide img{width:100%;height:100%;object-fit:cover;position:absolute}
.flip-h{animation:flipH 1s forwards}
@keyframes flipH{from{transform:rotateY(90deg);opacity:0}to{transform:rotateY(0);opacity:1}}
.flip-v{animation:flipV 1s forwards}
@keyframes flipV{from{transform:rotateX(90deg);opacity:0}to{transform:rotateX(0);opacity:1}}
.spiral{animation:spiral 1s forwards}
@keyframes spiral{from{transform:rotate(-720deg) scale(0);opacity:0}to{transform:rotate(0) scale(1);opacity:1}}
.ripple{animation:ripple 1s forwards}
@keyframes ripple{from{transform:scale(0.3);border-radius:50%;opacity:0}to{transform:scale(1);border-radius:0;opacity:1}}
.exit{animation:fadeOut 0.5s forwards}
@keyframes fadeOut{to{opacity:0}}
</style>
</head>
<body>
<div class="slide"><img id="img"></div>
<script>
let images=["https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=1000","https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?w=1000","https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=1000","https://images.unsplash.com/photo-1519681393784-d120267933ba?w=1000","https://images.unsplash.com/photo-1472214103451-9374bd1c798e?w=1000","https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=1000","https://images.unsplash.com/photo-1500534314209-a25ddb2bd429?w=1000"];
const effects=["flip-h","flip-v","spiral","ripple"];
const img=document.getElementById("img");
let idx=0;
function show(){
  const eff=effects[idx%effects.length];
  img.className="";img.src=images[idx%images.length];
  img.classList.add(eff);
  setTimeout(()=>{img.classList.remove(eff);img.classList.add("exit");},2800);
  idx++;setTimeout(show,3500);
}
window.onload=show;
window.addEventListener('message',function(e){
  if(!e.data||e.data.type!=='REELFORGE_IMAGES')return;
  if(!e.data.images||!e.data.images.length)return;
  images=e.data.images;idx=0;
});
</script>
</body>
</html>
