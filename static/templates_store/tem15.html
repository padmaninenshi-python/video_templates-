<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Diamond Show</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#111;display:flex;justify-content:center;align-items:center}
.slide{width:100%;height:100%;position:relative;overflow:hidden;background:#000}
.slide img{width:100%;height:100%;object-fit:cover;position:absolute}
.diamond{animation:diamondAnim 1s forwards}
@keyframes diamondAnim{
  0%{clip-path:polygon(50% 50%,50% 50%,50% 50%,50% 50%);opacity:0;transform:scale(0.8)}
  100%{clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);opacity:1;transform:scale(1)}
}
.diamond-full{animation:diamondFull 0.6s forwards}
@keyframes diamondFull{
  0%{clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
  100%{clip-path:polygon(0 0,100% 0,100% 100%,0 100%)}
}
.exit{animation:fadeOut 0.5s forwards}
@keyframes fadeOut{to{opacity:0}}
</style>
</head>
<body>
<div class="slide"><img id="img"></div>
<script>
let images=["https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=1000","https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?w=1000","https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=1000","https://images.unsplash.com/photo-1519681393784-d120267933ba?w=1000","https://images.unsplash.com/photo-1472214103451-9374bd1c798e?w=1000"];
const img=document.getElementById("img");
let idx=0;
function show(){
  img.className="";img.src=images[idx%images.length];
  img.classList.add("diamond");
  setTimeout(()=>img.classList.add("diamond-full"),900);
  setTimeout(()=>{img.classList.remove("diamond","diamond-full");img.classList.add("exit");},2800);
  idx++;setTimeout(show,3500);
}
window.onload=show;
window.addEventListener('message',function(e){
  if(!e.data||e.data.type!=='REELFORGE_IMAGES')return;
  if(!e.data.images||!e.data.images.length)return;
  images=e.data.images;idx=0;
});
</script>
</body>
</html>
