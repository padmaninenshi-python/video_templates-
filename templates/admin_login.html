<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caryanams Admin Login</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#f4f5fb; display:flex; align-items:center; justify-content:center; min-height:100vh; font-family:'DM Sans',sans-serif; }
.card { background:#fff; border-radius:20px; box-shadow:0 4px 40px rgba(109,74,252,0.10); padding:48px 40px; width:400px; max-width:95vw; }
.logo-wrap { display:flex; align-items:center; justify-content:center; margin-bottom:4px; background:#f4f5fb; border-radius:12px; padding:10px 16px; }
.badge { display:block; width:fit-content; margin:6px auto 28px; background:#6d4afc; color:#fff; font-size:11px; font-weight:700; padding:3px 12px; border-radius:20px; letter-spacing:1px; }
h2 { text-align:center; font-size:16px; font-weight:600; color:#1a1a2e; margin-bottom:28px; }
.form-group { margin-bottom:18px; }
label { display:block; font-size:12px; font-weight:600; color:#888; text-transform:uppercase; letter-spacing:.5px; margin-bottom:7px; }
.input-wrap { position:relative; }
.input-wrap i { position:absolute; left:14px; top:50%; transform:translateY(-50%); color:#bbb; font-size:14px; }
input { width:100%; padding:12px 14px 12px 38px; border:1.5px solid #e8e8f4; border-radius:10px; font-size:14px; font-family:'DM Sans',sans-serif; outline:none; transition:border .2s; background:#fafaff; color:#1a1a2e; }
input:focus { border-color:#6d4afc; }
.btn-login { width:100%; padding:13px; background:#6d4afc; color:#fff; border:none; border-radius:10px; font-size:15px; font-weight:600; font-family:'DM Sans',sans-serif; cursor:pointer; margin-top:8px; transition:background .2s; }
.btn-login:hover { background:#5a38e0; }
.error { background:#fff0f0; color:#e53e3e; border:1px solid #fec5c5; border-radius:8px; padding:10px 14px; font-size:13px; margin-bottom:16px; display:flex; align-items:center; gap:8px; }
.hint { text-align:center; font-size:12px; color:#bbb; margin-top:20px; }
</style>
</head>

  <span class="badge">ADMIN PANEL</span>
  <h2>Sign in to continue</h2>

  {% if error %}
  <div class="error"><i class="fas fa-exclamation-circle"></i> {{ error }}</div>
  {% endif %}

  <form method="POST" action="/admin/login">
    <div class="form-group">
      <label>Username</label>
      <div class="input-wrap">
        <i class="fas fa-user"></i>
        <input type="text" name="username" placeholder="admin" required autocomplete="username">
      </div>
    </div>
    <div class="form-group">
      <label>Password</label>
      <div class="input-wrap">
        <i class="fas fa-lock"></i>
        <input type="password" name="password" placeholder="••••••••" required autocomplete="current-password">
      </div>
    </div>
    <button type="submit" class="btn-login"><i class="fas fa-sign-in-alt"></i> &nbsp;Login</button>
  </form>
